<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Text to Image</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef1f6; --surface: #ffffff; --ink: #16213a; --muted: #5d6b86;
    --line: #cfd6e4; --accent: #2f4bff; --accent-ink: #ffffff; --err: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1424; --surface: #171e33; --ink: #e8ecf8; --muted: #93a0bd;
      --line: #2b3554; --accent: #7b8cff; --accent-ink: #0f1424; --err: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    font-family: "Sora", system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; justify-content: center; padding: 32px 16px;
  }
  main { width: 100%; max-width: 640px; }
  h1 { font-size: 2rem; line-height: 1.15; margin: 0 0 8px; letter-spacing: -0.02em; }
  p.sub { margin: 0 0 24px; color: var(--muted); line-height: 1.5; }
  textarea {
    width: 100%; min-height: 110px; resize: vertical; padding: 14px;
    font: inherit; color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: 10px;
  }
  textarea:focus, input:focus, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .row { display: flex; gap: 12px; margin-top: 12px; flex-wrap: wrap; align-items: end; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; color: var(--muted); }
  input[type=number] {
    width: 110px; padding: 10px; font: inherit; color: var(--ink);
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  }
  button {
    margin-left: auto; padding: 12px 22px; font: inherit; font-weight: 600; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px;
  }
  button:disabled { opacity: .6; cursor: progress; }
  #status { margin-top: 20px; min-height: 1.4em; color: var(--muted); font-size: .9rem; }
  #status.error { color: var(--err); }
  #result { margin-top: 12px; }
  #result img { width: 100%; border-radius: 12px; display: block; border: 1px solid var(--line); }
  #meta { margin: 10px 0 0; font-size: .85rem; color: var(--muted); line-height: 1.5; }
  a.dl { color: var(--accent); font-size: .9rem; }
</style>
</head>
<body>
<main>
  <h1>Describe it. See it.</h1>
  <p class="sub">Write in English, Hindi, Kannada, Spanish, French and many other languages. Your text is translated to English, then drawn by Stable Diffusion. Running on {{ device|upper }}.</p>

  <textarea id="prompt" placeholder="e.g. A Big Brown Fox"></textarea>
  <div class="row">
    <label>Steps
      <input id="steps" type="number" min="5" max="50" value="{{ 25 if device == 'cuda' else 12 }}">
    </label>
    <label>Seed (optional)
      <input id="seed" type="number" placeholder="random">
    </label>
    <button id="go">Generate image</button>
  </div>

  <div id="status" role="status" aria-live="polite"></div>
  <div id="result"></div>
</main>

<script>
const $ = (id) => document.getElementById(id);

async function generate() {
  const prompt = $("prompt").value.trim();
  if (!prompt) { setStatus("Enter a description first.", true); return; }

  $("go").disabled = true;
  $("result").innerHTML = "";
  setStatus("Generating... this can take a few minutes on CPU.");

  try {
    const res = await fetch("/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        prompt,
        steps: Number($("steps").value),
        seed: $("seed").value
      })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Something went wrong.");

    setStatus("");
    $("result").innerHTML =
      `<img alt="Generated image for: ${escapeHtml(data.english_prompt)}" src="${data.image}">` +
      `<p id="meta">Detected language: ${escapeHtml(data.language)}. Prompt used: ${escapeHtml(data.english_prompt)}</p>` +
      `<a class="dl" download="generated.png" href="${data.image}">Download PNG</a>`;
  } catch (err) {
    setStatus(err.message, true);
  } finally {
    $("go").disabled = false;
  }
}

function setStatus(msg, isError = false) {
  $("status").textContent = msg;
  $("status").className = isError ? "error" : "";
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

$("go").addEventListener("click", generate);
$("prompt").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) generate();
});
</script>
</body>
</html>
